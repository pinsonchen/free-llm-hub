[project]
name = "free-llm-hub"
version = "0.0.1"
description = "Developer-first router for free-tier LLM APIs behind an OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pinsonchen" }]
keywords = ["llm", "openai", "gateway", "router", "litellm", "free-tier"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "litellm>=1.52",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
freellm = "app.cli:main"

[project.urls]
Homepage = "https://github.com/pinsonchen/free-llm-hub"
Issues = "https://github.com/pinsonchen/free-llm-hub/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/api/dashboard.html" = "app/api/dashboard.html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
